<!doctype html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Critical App Error:', e);
        showFallbackUI(e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Promise Rejection:', e);
        showFallbackUI(e.reason ? (e.reason.message || e.reason) : 'Promise rejection');
      });
      function showFallbackUI(msg) {
        var app = document.getElementById('app') || document.body;
        if (!document.getElementById('error-fallback')) {
          app.innerHTML = `
            <div id="error-fallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;background:#1a1a1a;color:#fdfbf7;font-family:sans-serif;text-align:center;padding:20px;">
              <h2>Sanctuary Initializing...</h2>
              <p style="opacity:0.8;max-width:400px;margin:10px 0 20px;">An update was applied or the display renderer is restarting.</p>
              <button onclick="clearCacheAndReload()" style="padding:12px 24px;background:#fdfbf7;color:#1a1a1a;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Reload Sanctuary</button>
            </div>
          `;
        }
      }
      function clearCacheAndReload() {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) { reg.unregister(); });
          });
        }
        window.location.reload(true);
      }
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>YearGlass — A Living Digital Sanctuary</title>
    <meta
      name="description"
      content="A living world that grows with you. A tiny ecosystem. A lifetime of memories."
    />
    <meta name="theme-color" content="#0d0d0e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0d0d0e;
        color: #f0ede8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #app, #root, #yearglass-mount, .game-container, canvas {
        width: 100% !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        overflow: hidden !important;
        touch-action: none;
      }
      .yearglass-layer, .yearglass-room, .yearglass-ui-overlay {
        pointer-events: none !important;
      }
      .yearglass-top-bar, .yg-hud-btn, .yg-btn-badge, .yg-dialogue-card,
      .yg-evolution-popup, .yg-toast, .yg-modal-overlay, .yg-modal-card,
      .yg-close-btn, .yg-ack-btn {
        pointer-events: auto !important;
        z-index: 100 !important;
      }
      [class*="card"], [class*="dialogue"], [class*="popup"] {
        background-color: #f7f2ea !important;
        color: #111111 !important;
      }
      [class*="card"] *, [class*="dialogue"] * {
        color: #111111 !important;
        -webkit-text-fill-color: #111111 !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
