<!doctype html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Critical App Error:', e);
        showFallbackUI(e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Promise Rejection:', e);
        showFallbackUI(e.reason ? (e.reason.message || e.reason) : 'Promise rejection');
      });
      function showFallbackUI(msg) {
        var app = document.getElementById('app') || document.body;
        if (!document.getElementById('error-fallback')) {
          app.innerHTML = `
            <div id="error-fallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;background:#1a1a1a;color:#fdfbf7;font-family:sans-serif;text-align:center;padding:20px;">
              <h2>Sanctuary Initializing...</h2>
              <p style="opacity:0.8;max-width:400px;margin:10px 0 20px;">An update was applied or the display renderer is restarting.</p>
              <button onclick="clearCacheAndReload()" style="padding:12px 24px;background:#fdfbf7;color:#1a1a1a;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Reload Sanctuary</button>
            </div>
          `;
        }
      }
      function clearCacheAndReload() {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) { reg.unregister(); });
          });
        }
        window.location.reload(true);
      }
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>YearGlass — A Living Digital Sanctuary</title>
    <meta
      name="description"
      content="A living world that grows with you. A tiny ecosystem. A lifetime of memories."
    />
    <meta name="theme-color" content="#0d0d0e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* Viewport Root Containment */
      html, body, #app, #yearglass-mount {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        overflow: hidden !important;
        position: fixed !important;
        inset: 0 !important;
        background: #0d0d0e !important;
        color: #f0ede8 !important;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        touch-action: manipulation !important;
        -webkit-tap-highlight-color: transparent !important;
      }

      /* Level 0: Room & WebGL Terrarium Canvas */
      .yearglass-room, .yearglass-canvas, canvas {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 0 !important;
        touch-action: none !important;
      }

      /* Level 10: Ambient Lighting Layer Strata */
      .yearglass-layer {
        position: absolute !important;
        inset: 0 !important;
        z-index: 10 !important;
        pointer-events: none !important;
      }

      /* Level 100: Top HUD, Modals & Drawers */
      .yearglass-ui-overlay {
        position: fixed !important;
        inset: 0 !important;
        z-index: 100 !important;
        pointer-events: none !important;
      }

      .yearglass-top-bar {
        position: fixed !important;
        top: max(10px, env(safe-area-inset-top)) !important;
        left: 1rem !important;
        right: 1rem !important;
        z-index: 100 !important;
        pointer-events: auto !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
      }

      .yg-hud-btn, .yg-btn-badge {
        min-height: 40px !important;
        padding: 8px 14px !important;
        font-size: 14px !important;
        line-height: 1.2 !important;
        color: #1a1a1a !important;
        background: #fdfbf7 !important;
        border: 1px solid rgba(191, 160, 106, 0.6) !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4) !important;
        border-radius: 999px !important;
        font-weight: 700 !important;
        pointer-events: auto !important;
        z-index: 100 !important;
        touch-action: manipulation !important;
        cursor: pointer !important;
      }

      /* Bottom Drawer: Off-screen by default (100% translateY) */
      .yg-drawer-card {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        z-index: 100 !important;
        pointer-events: auto !important;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) !important;
      }

      .yg-drawer-card.is-open {
        transform: translateY(0) !important;
      }

      .yg-dialogue-card, .yg-evolution-popup, .yg-toast, .yg-modal-overlay, .yg-modal-card {
        z-index: 100 !important;
        pointer-events: auto !important;
      }

      /* Level 200: Arrival Screen Overlay */
      #yg-intro-overlay, .yearglass-intro {
        position: fixed !important;
        inset: 0 !important;
        z-index: 200 !important;
        pointer-events: auto !important;
      }

      [class*="card"], [class*="dialogue"], [class*="popup"] {
        background-color: #f7f2ea !important;
        color: #111111 !important;
      }
      [class*="card"] *, [class*="dialogue"] * {
        color: #111111 !important;
        -webkit-text-fill-color: #111111 !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
